name: myapp
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.3 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.10.0
  home_widget: ^0.5.0
  shared_preferences: ^2.5.4
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/videos/

  fonts:
    - family: DuolingoFeather
      fonts:
        - asset: assets/fonts/Duolingo Feather Bold.ttf
          weight: 700
    - family: DINRoundPro
      fonts:
        - asset: assets/fonts/dinroundpro.otf
        - asset: assets/fonts/dinroundpro_black.otf
          weight: 900
        - asset: assets/fonts/dinroundpro_bold.otf
          weight: 700
        - asset: assets/fonts/dinroundpro_light.otf
          weight: 300
        - asset: assets/fonts/dinroundpro_medi.otf
          weight: 500
