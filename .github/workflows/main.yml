name: Flutter Build APK

on:
  push:
    branches: [ main, master ] # Triggers build when pushing to these branches
  workflow_dispatch: # Allows you to trigger the build manually

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Set up Java Environment (Required for Android Builds)
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      # 3. Set up Flutter Environment
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true # Caches dependencies for faster subsequent builds

      # 4. Install dependencies
      - name: Install Dependencies
        run: flutter pub get

      # 5. Build the Release APK
      - name: Build APK
        run: flutter build apk --release --android-skip-build-dependency-validation

      # 6. Upload the APK file so you can download it
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          
